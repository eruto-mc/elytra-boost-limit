buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = '1.2.0'
group = 'net.erutobusiness'
base { archivesName = 'elytra_boost_limit' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

mixin {
    add sourceSets.main, 'elytraboostlimit.refmap.json'
    config 'elytraboostlimit.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'elytra_boost_limit',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Elytra Boost Limit',
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'elytraboostlimit.mixins.json'
        ])
    }
}
